name: CMM Worker Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch Worker ping
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            "https://cmm-meta-monitor.choixmalinmaroc.workers.dev/task?ping=1" \
            -o worker-test.json

          cat worker-test.json

      - name: Commit test result
        run: |
          git config user.name "cmm-meta-bot"
          git config user.email "actions@users.noreply.github.com"

          git add worker-test.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Worker connectivity test"
          git push
