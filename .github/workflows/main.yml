name: CMM Daily Meta Brief
event_name = os.environ.get(
    "GITHUB_EVENT_NAME",
    ""
)

if event_name == "workflow_dispatch":
    valid = False

    print(
        "Manual workflow_dispatch: "
        "forcing report refresh"
    )
on:
  workflow_dispatch:

  schedule:
    # Multiple retry windows because GitHub scheduled jobs are not guaranteed
    # to start exactly on time.
    - cron: "17,37,57 5-9 * * *"
      timezone: "Africa/Casablanca"

    # Final safety attempt before the CMM daily analysis.
    - cron: "11 10 * * *"
      timezone: "Africa/Casablanca"

permissions:
  contents: write

concurrency:
  group: cmm-daily-meta-brief
  cancel-in-progress: false

jobs:
  update-daily-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # ==========================================================
      # 2. DETERMINE TARGET DATE + DEDUPLICATION
      # ==========================================================

      - name: Check if yesterday report already exists
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          git pull --ff-only origin main

          TARGET_DATE="$(TZ=Africa/Casablanca date -d 'yesterday' +%F)"
          export TARGET_DATE

          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ["TARGET_DATE"]
          path = Path("reports") / f"{target}.json"

          valid = False

          if path.exists():
              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  health = (
                      data.get("source_health")
                      or {}
                  )

                  valid = (
                      data.get("ok") is True
                      and data.get("report_date") == target
                      and health.get("worker_ok") is True
                      and health.get("daily_brief_ok") is True
                  )

              except Exception as exc:
                  print(
                      f"Existing report validation error: {exc}"
                  )
                  valid = False

event_name = os.environ.get(
    "GITHUB_EVENT_NAME",
    ""
)

if event_name == "workflow_dispatch":
    valid = False

    print(
        "Manual workflow_dispatch: "
        "forcing report refresh"
    )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"skip={'true' if valid else 'false'}\n"
              )

          if valid:
              print(
                  f"Valid report already exists: {path}"
              )
          else:
              print(
                  f"Report needs publishing: {path}"
              )
          PY

      # ==========================================================
      # 3. FETCH WORKER
      # ==========================================================

      - name: Fetch full CMM Worker report
        if: steps.preflight.outputs.skip != 'true'
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 240 \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://cmm-meta-monitor.choixmalinmaroc.workers.dev/" \
            -o worker-full.json

      # ==========================================================
      # 4. BUILD SANITIZED DAILY BRIEF
      # ==========================================================

      - name: Build sanitized daily brief
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone


          # ======================================================
          # READ WORKER RESPONSE
          # ======================================================

          with open(
              "worker-full.json",
              "r",
              encoding="utf-8"
          ) as f:
              source = json.load(f)


          if source.get("ok") is not True:
              raise SystemExit(
                  "Worker returned ok != true"
              )


          report_date = source.get(
              "report_date"
          )

          target_date = os.environ.get(
              "TARGET_DATE"
          )

          daily_brief = source.get(
              "daily_brief"
          )


          # ======================================================
          # SOURCE VALIDATION
          # ======================================================

          if not report_date:
              raise SystemExit(
                  "Missing report_date"
              )

          if not target_date:
              raise SystemExit(
                  "Missing TARGET_DATE"
              )

          if report_date != target_date:
              raise SystemExit(
                  "Worker report_date mismatch: "
                  f"expected {target_date}, "
                  f"got {report_date}"
              )

          if not isinstance(
              daily_brief,
              dict
          ):
              raise SystemExit(
                  "Missing or invalid daily_brief"
              )


          # ======================================================
          # PUBLIC WHITELIST — PRODUCTS
          # ======================================================

          safe_products = []

          for product in daily_brief.get(
              "products",
              []
          ):

              if not isinstance(
                  product,
                  dict
              ):
                  continue

              lifetime = (
                  product.get("lifetime")
                  or {}
              )

              safe_products.append({

                  "product_code":
                      product.get(
                          "product_code"
                      ),

                  "sku":
                      product.get(
                          "sku"
                      ),

                  "delivery_state":
                      product.get(
                          "delivery_state"
                      ),

                  "ads_active":
                      product.get(
                          "ads_active"
                      ),

                  "active_daily_budget":
                      product.get(
                          "active_daily_budget"
                      ),

                  "budget_currency":
                      product.get(
                          "budget_currency"
                      ),

                  "lifetime": {

                      "since":
                          lifetime.get(
                              "since"
                          ),

                      "until":
                          lifetime.get(
                              "until"
                          ),

                      "decision":
                          lifetime.get(
                              "decision"
                          ),

                      "reason":
                          lifetime.get(
                              "reason"
                          ),

                      "total_orders":
                          lifetime.get(
                              "total_orders"
                          ),

                      "terminal_orders":
                          lifetime.get(
                              "terminal_orders"
                          ),

                      "terminal_rate_pct":
                          lifetime.get(
                              "terminal_rate_pct"
                          ),

                      "roi_delivered_pct":
                          lifetime.get(
                              "roi_delivered_pct"
                          ),

                      "net_delivered_mad":
                          lifetime.get(
                              "net_delivered_mad"
                          )
                  },

                  "current_72h_decision":
                      product.get(
                          "current_72h_decision"
                      ),

                  "action_ar":
                      product.get(
                          "action_ar"
                      )
              })


          # ======================================================
          # PUBLIC WHITELIST — ADS
          # ======================================================

          safe_ads = []

          for ad in daily_brief.get(
              "ads",
              []
          ):

              if not isinstance(
                  ad,
                  dict
              ):
                  continue

              safe_ads.append({

                  "product_code":
                      ad.get(
                          "product_code"
                      ),

                  "ad_name":
                      ad.get(
                          "ad_name"
                      ),

                  "delivery":
                      ad.get(
                          "delivery"
                      ),

                  "action":
                      ad.get(
                          "action"
                      ),

                  "reason":
                      ad.get(
                          "reason"
                      ),

                  "spend":
                      ad.get(
                          "spend"
                      ),

                  "purchases":
                      ad.get(
                          "purchases"
                      ),

                  "cpa":
                      ad.get(
                          "cpa"
                      ),

                  "ctr_link":
                      ad.get(
                          "ctr_link"
                      ),

                  "landing_page_rate":
                      ad.get(
                          "landing_page_rate"
                      )
              })


          # ======================================================
          # FINAL PUBLIC DAILY BRIEF
          # ======================================================

          safe_daily_brief = {

              "version":
                  daily_brief.get(
                      "version"
                  ),

              "period":
                  daily_brief.get(
                      "period"
                  ),

              "products":
                  safe_products,

              "ads":
                  safe_ads
          }


          feed = {

              "ok": True,

              "feed_version":
                  "CMM_GITHUB_DAILY_BRIEF_V1",

              "source":
                  "cmm-meta-monitor",

              "report_date":
                  report_date,

              "generated_at":
                  source.get(
                      "generated_at"
                  ),

              "published_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source_health": {
                  "worker_ok": True,
                  "daily_brief_ok": True
              },

              "daily_brief":
                  safe_daily_brief
          }


          # ======================================================
          # WRITE FILES
          # ======================================================

          def write_json(
              path,
              payload
          ):

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      payload,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

                  f.write("\n")


          # Latest public feed

          write_json(
              "daily-brief.json",
              feed
          )


          # Immutable dated report

          os.makedirs(
              "reports",
              exist_ok=True
          )

          dated_path = (
              f"reports/{report_date}.json"
          )

          write_json(
              dated_path,
              feed
          )


          print(
              json.dumps(
                  {
                      "report_date":
                          report_date,

                      "dated_file":
                          dated_path,

                      "products":
                          len(
                              safe_products
                          ),

                      "ads":
                          len(
                              safe_ads
                          )
                  },
                  ensure_ascii=False
              )
          )

          PY

      # ==========================================================
      # 5. VALIDATE GENERATED REPORT
      # ==========================================================

      - name: Validate generated dated report
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 <<'PY'
          import json
          import os

          target = os.environ["TARGET_DATE"]

          path = (
              f"reports/{target}.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          health = (
              data.get("source_health")
              or {}
          )

          valid = (
              data.get("ok") is True
              and data.get("report_date") == target
              and health.get("worker_ok") is True
              and health.get("daily_brief_ok") is True
          )

          if not valid:
              raise SystemExit(
                  "Generated dated report failed validation"
              )

          print(
              f"Validated successfully: {path}"
          )

          PY

      # ==========================================================
      # 6. REMOVE PRIVATE TEMPORARY WORKER DATA
      # ==========================================================

      - name: Remove temporary full report
        if: always() && steps.preflight.outputs.skip != 'true'
        run: |
          rm -f worker-full.json

      # ==========================================================
      # 7. COMMIT PUBLIC SANITIZED REPORT
      # ==========================================================

      - name: Commit sanitized daily brief
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git config \
            user.name \
            "cmm-meta-bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            daily-brief.json \
            reports/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Update CMM daily Meta brief"

          git pull \
            --rebase \
            origin main

          git push \
            origin HEAD:main
